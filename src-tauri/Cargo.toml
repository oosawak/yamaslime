[package]
name = "yamaslime_tauri"
version = "0.1.0"
description = "Yama Tetris - slime stacking game"
authors = ["yamaslime"]
edition = "2021"

[lib]
name = "yamaslime_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
